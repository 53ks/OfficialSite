<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライバシーポリシー - 53ks Official</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col justify-between">
  <header class="p-6 border-b border-slate-100">
    <a href="/" class="text-sm font-bold text-slate-600 inline-flex items-center gap-2 hover:text-slate-900">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>トップへ戻る</span>
    </a>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-16 flex-grow">
    <h1 class="text-3xl font-extrabold mb-8">プライバシーポリシー</h1>
    <div class="space-y-6 text-slate-600 text-sm leading-relaxed">
      <section>
        <h2 class="text-base font-bold text-slate-900 mb-2">1. 収集する情報</h2>
        <p>本サービスでは、アクセス解析やDiscordボットの運用において、利用状況データやID情報等を必要最小限の範囲で収集することがあります。</p>
      </section>
      <section>
        <h2 class="text-base font-bold text-slate-900 mb-2">2. 情報の利用目的</h2>
        <p>収集した情報は、サービスの提供・機能改善および障害対応のためにのみ使用いたします。</p>
      </section>
    </div>
  </main>

  <footer class="p-6 border-t border-slate-100 text-center text-xs text-slate-400">
    © 53ks Official
  </footer>

  <script src="../assets/js/common.js"></script>
</body>
</html>
